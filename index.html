<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Animation Link Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #050505;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid rgba(234, 128, 176, 0.4);
      padding: 35px 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(234, 128, 176, 0.15);
      backdrop-filter: blur(10px);
    }

    h2 {
      color: #ea80b0;
      font-size: 1.5rem;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    p.subtitle {
      color: #a0a0a0;
      font-size: 0.85rem;
      margin-bottom: 25px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 15px;
    }

    label {
      font-size: 0.85rem;
      color: #ea80b0;
      margin-bottom: 6px;
      display: block;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid rgba(234, 128, 176, 0.3);
      background: #111;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #ea80b0;
      box-shadow: 0 0 12px rgba(234, 128, 176, 0.3);
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ea80b0, #d45d93);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(234, 128, 176, 0.4);
    }

    .output-box {
      margin-top: 25px;
      display: none;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn-secondary {
      flex: 1;
      padding: 12px 10px;
      background: transparent;
      color: #ea80b0;
      border: 1px solid #ea80b0;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
      text-align: center;
      text-decoration: none;
    }

    .btn-secondary:hover {
      background: rgba(234, 128, 176, 0.15);
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>#Herosalman1 Tools ✨ </h2>
    <p class="subtitle">Apne Friend ka Name Type karo !!</p>
    
    <div class="input-group">
      <label for="nameInput">fill-Up</label>
      <input type="text" id="nameInput" placeholder="e.g. Diya" autocomplete="off" />
    </div>

    <!-- Hidden URL storage -->
    <input type="hidden" id="generatedUrl">

    <button class="btn-main" id="genBtn" onclick="generateLink()">Generate Link ✨</button>

    <div class="output-box" id="outputBox">
      <div class="btn-group">
        <button id="copyBtn" class="btn-secondary" onclick="copyLink()">Copy Link 📋</button>
        <button class="btn-secondary" onclick="previewLink()" style="background: #ea80b0; color: #000;">Click To Preview 🚀</button>
      </div>
    </div>
  </div>

  <script>
    // Title Case format (e.g., diya -> Diya)
    function toTitleCase(str) {
      return str.toLowerCase().replace(/(?:^|\s)\w/g, function(match) {
        return match.toUpperCase();
      });
    }

    // Auto convert typing to Title Case
    document.getElementById('nameInput').addEventListener('input', function(e) {
      let start = this.selectionStart;
      let end = this.selectionEnd;
      this.value = toTitleCase(this.value);
      this.setSelectionRange(start, end); 
    });

    function generateLink() {
      const nameInput = document.getElementById("nameInput");
      const outputBox = document.getElementById("outputBox");
      const genBtn = document.getElementById("genBtn");
      const name = nameInput.value.trim();

      if (!name) {
        const oldText = genBtn.innerText;
        genBtn.innerText = "Please enter a name! ⚠️";
        genBtn.style.background = "#ff5555";
        genBtn.style.color = "#fff";
        
        setTimeout(() => {
          genBtn.innerText = oldText;
          genBtn.style.background = "linear-gradient(135deg, #ea80b0, #d45d93)";
          genBtn.style.color = "#000";
        }, 2000);
        outputBox.style.display = "none";
        return;
      }

      // Detect current path and format URL
      let baseUrl = window.location.href.split('?')[0].split('#')[0];
      if (baseUrl.endsWith('index.html')) {
        baseUrl = baseUrl.slice(0, -10);
      }
      if (!baseUrl.endsWith('/')) {
        baseUrl += '/';
      }

      const finalUrl = `${baseUrl}surprise.html?n=${encodeURIComponent(name)}`;
      
      // Save link securely in hidden input
      document.getElementById("generatedUrl").value = finalUrl;
      outputBox.style.display = "block";
    }

    function copyLink() {
      const linkText = document.getElementById("generatedUrl").value;
      const copyBtn = document.getElementById("copyBtn");

      navigator.clipboard.writeText(linkText).then(() => {
        copyBtn.innerText = "Copied! ✓";
        copyBtn.style.background = "rgba(76, 209, 55, 0.2)";
        copyBtn.style.borderColor = "#4cd137";
        copyBtn.style.color = "#4cd137";
        
        setTimeout(() => {
          copyBtn.innerText = "Copy Link 📋";
          copyBtn.style.background = "transparent";
          copyBtn.style.borderColor = "#ea80b0";
          copyBtn.style.color = "#ea80b0";
        }, 2000);
      });
    }

    function previewLink() {
      const linkText = document.getElementById("generatedUrl").value;
      if (linkText) {
        window.location.href = linkText;
      }
    }
  </script>
</body>
</html>
