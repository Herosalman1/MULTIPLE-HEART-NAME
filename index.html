<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Heart Link</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #111;
      border: 1px solid #ea80b0;
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 20px rgba(234, 128, 176, 0.2);
    }
    h2 {
      color: #ea80b0;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ea80b0;
      background: #222;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 15px;
      outline: none;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #ea80b0;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }
    button:hover {
      background: #f09bc1;
    }
    .output-box {
      margin-top: 20px;
      display: none;
      word-break: break-all;
    }
    .link-display {
      background: #222;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #ea80b0;
      margin-bottom: 10px;
      border: 1px dashed #ea80b0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Heart Name Link Generator</h2>
    <input type="text" id="nameInput" placeholder="Enter Name..." />
    <button onclick="generateLink()">Generate Link</button>

    <div class="output-box" id="outputBox">
      <div class="link-display" id="linkDisplay"></div>
      <button onclick="copyLink()">Copy Link</button>
    </div>
  </div>

  <script>
    function generateLink() {
      const name = document.getElementById("nameInput").value.trim();
      if (!name) {
        alert("Please enter a name!");
        return;
      }
      
      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
      const finalUrl = `${baseUrl}/surprise.html?n=${encodeURIComponent(name)}`;
      
      document.getElementById("linkDisplay").innerText = finalUrl;
      document.getElementById("outputBox").style.display = "block";
    }

    function copyLink() {
      const linkText = document.getElementById("linkDisplay").innerText;
      navigator.clipboard.writeText(linkText);
      alert("Link Copied!");
    }
  </script>
</body>
</html>
