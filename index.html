<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation Link Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #000; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1a1a1a; padding: 30px; border-radius: 15px; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(234, 128, 176, 0.2); border: 1px solid #ea80b0; }
        h2 { text-align: center; color: #ea80b0; margin-bottom: 25px; letter-spacing: 1px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #fce7f3; }
        input { width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 8px; border: 1px solid rgba(234, 128, 176, 0.5); background: rgba(0,0,0,0.5); color: white; font-size: 1rem; outline: none; }
        input:focus { border-color: #ea80b0; box-shadow: 0 0 10px rgba(234, 128, 176, 0.3); }
        button { width: 100%; background: #ea80b0; border: none; padding: 15px; border-radius: 8px; color: #000; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-bottom: 15px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(234, 128, 176, 0.4); }
        .result-box { display: none; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; margin-top: 10px; word-break: break-all; font-size: 0.85rem; border: 1px dashed #ea80b0; }
        .result-title { font-size: 0.8rem; color: #ea80b0; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Heart Link Generator 💖</h2>
        
        <label>Enter Name (e.g. Herosalman1, Priya):</label>
        <input type="text" id="personName" placeholder="Type name here..." autocomplete="off">
        
        <button onclick="generateLink()">Generate Link 🔗</button>

        <div id="resultBox" class="result-box">
            <div class="result-title">Copy this link and send:</div>
            <p id="generatedUrl" style="margin-bottom: 15px; color: #fff;"></p>
            <button onclick="copyLink()" style="padding: 10px; background: transparent; color: #ea80b0; border: 1px solid #ea80b0;">Copy Link 📋</button>
        </div>
    </div>

    <script>
        function generateLink() {
            const name = document.getElementById('personName').value.trim();
            
            if(!name) {
                alert("Please enter a name first!");
                return;
            }

            // Encode Name securely
            const encodedData = btoa(unescape(encodeURIComponent(name)));
            
            // Generate URL based on current host
            let baseUrl = window.location.href.split('?')[0];
            if(baseUrl.endsWith('index.html')) {
                baseUrl = baseUrl.replace('index.html', '');
            }
            if(!baseUrl.endsWith('/')) baseUrl += '/';
            
            const finalLink = `${baseUrl}surprise.html?n=${encodedData}`;
            
            document.getElementById('generatedUrl').innerText = finalLink;
            document.getElementById('resultBox').style.display = 'block';
        }

        function copyLink() {
            const linkText = document.getElementById('generatedUrl').innerText;
            navigator.clipboard.writeText(linkText).then(() => {
                alert("Link Copied Successfully! 🎉");
            });
        }
    </script>
</body>
</html>
